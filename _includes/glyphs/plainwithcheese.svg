{%- comment -%}The plainwithcheese glyph: the end mark under Burgers posts and the site's mark in dialogues (participants.yml). The favicon's burger (the owner's v2 drawing, 2026-11-19) as a one-color stencil: every pixel of the burger and plate in the text color (currentColor, so it follows the theme and prints black), with the light ones (seeds, cheese, the plate's highlight) left out; anti-aliased edges as opacity. The top bun's outline is smoothed into an even dome (one soft pixel per side per row), and no seed is cut where it would touch the outline, so the curve stays whole. Drawn on a 32px grid with crispEdges; shown at 24px as the end mark and 16px in dialogues (CSS). Keep the class and the one-line output. The burger mark is the owner's: all rights reserved, and not covered by this repo's code license or the CC BY-NC license on the writing and art (README.md, "Licensing"; NOTICE).{%- endcomment -%}<svg class="dlg-glyph-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><path fill="currentColor" fill-opacity="0.24" d="M10 5h1v1h-1zM6 7h1v1h-1z"/><path fill="currentColor" d="M11 5h1v1h-1zM13 5h5v1h-5zM19 5h1v1h-1zM10 6h2v1h-2zM13 6h3v1h-3zM17 6h5v1h-5zM8 7h13v1h-13zM22 7h2v1h-2zM6 8h7v1h-7zM14 8h2v1h-2zM17 8h2v1h-2zM20 8h5v1h-5zM6 9h3v1h-3zM10 9h2v1h-2zM13 9h4v1h-4zM18 9h4v1h-4zM23 9h4v1h-4zM6 10h9v1h-9zM16 10h4v1h-4zM21 10h6v1h-6zM4 11h24v1h-24zM4 12h8v1h-8zM13 12h3v1h-3zM17 12h11v1h-11zM4 13h25v1h-25zM3 14h26v1h-26zM4 15h3v1h-3zM11 15h11v1h-11zM23 15h1v1h-1zM26 15h2v1h-2zM4 16h5v1h-5zM19 16h9v1h-9zM4 17h7v1h-7zM15 17h13v1h-13zM4 18h8v1h-8zM14 18h14v1h-14zM4 19h2v1h-2zM8 19h4v1h-4zM14 19h10v1h-10zM27 19h1v1h-1zM3 20h5v1h-5zM24 20h5v1h-5zM3 21h9v1h-9zM22 21h7v1h-7zM4 22h12v1h-12zM20 22h8v1h-8zM1 23h1v1h-1zM6 23h10v1h-10zM20 23h6v1h-6zM30 23h1v1h-1zM2 24h1v1h-1zM11 24h6v1h-6zM19 24h2v1h-2zM29 24h1v1h-1zM4 25h1v1h-1zM27 25h1v1h-1zM7 26h3v1h-3zM22 26h3v1h-3zM15 27h2